{% extends "base.html" %}
{% block title %}DARKSPECTRE AI — Reports{% endblock %}
{% block content %}
<div class="dashboard-section">
    <div class="container">
        <h2 class="section-title text-center"><i class="fas fa-file-alt" style="color:#ff2d95"></i> Security Reports</h2>
        <p class="text-center" style="color:#888;margin-bottom:40px">Download professional security assessment reports</p>
        
        <div id="reportsContainer">
            <div style="text-align:center;padding:60px">
                <div style="font-size:4em;color:rgba(255,45,149,0.3);margin-bottom:20px"><i class="fas fa-file-export"></i></div>
                <h4 style="color:#555">No Reports Available</h4>
                <p style="color:#444">Complete a scan first to generate reports</p>
                <a href="{{ url_for('scan_page') }}" class="btn-glow" style="display:inline-flex;font-size:0.9em;padding:12px 30px">
                    <i class="fas fa-bolt"></i> Start Scan
                </a>
            </div>
        </div>
    </div>
</div>

<script>
function loadReports() {
    fetch('/api/all-scans')
    .then(r => r.json())
    .then(data => {
        const container = document.getElementById('reportsContainer');
        
        if (data.length === 0) return; // Keep default message
        
        let html = '<div class="row g-4">';
        data.forEach(s => {
            html += `
                <div class="col-md-6 col-lg-4">
                    <div class="report-card">
                        <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:15px">
                            <h4 style="color:#fff;font-size:1.1em;margin:0">
                                <i class="fas fa-globe" style="color:#ff2d95;margin-right:8px"></i>
                                ${s.target}
                            </h4>
                            <span class="risk-badge risk-${(s.risk_level||'low').toLowerCase()}">${s.risk_level||'N/A'}</span>
                        </div>
                        <p style="color:#888;font-size:0.85em">
                            <i class="fas fa-calendar"></i> ${s.timestamp ? s.timestamp.slice(0,10) : 'N/A'}
                            <span style="margin-left:15px"><i class="fas fa-bug"></i> ${s.vulnerabilities||0} vulns</span>
                        </p>
                        <div style="margin-top:15px">
                            <a href="/api/download-report/${s.scan_id}/html" class="btn-glow" style="display:inline-flex;font-size:0.85em;padding:8px 20px;margin-right:8px">
                                <i class="fas fa-file-code"></i> HTML
                            </a>
                            <button onclick="viewReport('${s.scan_id}')" style="background:none;border:1px solid #b388ff;color:#b388ff;padding:8px 20px;border-radius:50px;cursor:pointer;font-size:0.85em;">
                                <i class="fas fa-eye"></i> View
                            </button>
                        </div>
                    </div>
                </div>`;
        });
        html += '</div>';
        container.innerHTML = html;
    })
    .catch(() => {});
}

function viewReport(scanId) {
    window.open('/api/download-report/' + scanId + '/html', '_blank');
}

loadReports();
</script>
{% endblock %}
