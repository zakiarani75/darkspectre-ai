<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DARKSPECTRE AI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0015 0%, #1a0033 50%, #0d0221 100%);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0015; }
        ::-webkit-scrollbar-thumb { background: #ff2d95; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #b388ff; }
        
        /* Navigation */
        .navbar {
            background: rgba(10, 0, 21, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 45, 149, 0.3);
            padding: 15px 0;
        }
        .navbar-brand {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 1.5em;
        }
        .brand-icon { color: #ff2d95; margin-right: 8px; }
        .brand-text { color: #fff; }
        .brand-sub { color: #b388ff; font-size: 0.7em; margin-left: 4px; }
        .navbar-nav .nav-link {
            color: #b388ff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 1.1em;
            padding: 8px 18px;
            margin: 0 4px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .navbar-nav .nav-link:hover, .navbar-nav .nav-link.active {
            color: #fff;
            background: rgba(255, 45, 149, 0.15);
            box-shadow: 0 0 20px rgba(255, 45, 149, 0.2);
        }
        .navbar-nav .nav-link i { margin-right: 6px; color: #ff2d95; }
        
        /* Hero Section */
        .hero-section {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .hero-section::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,45,149,0.1) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            animation: pulseGlow 4s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }
        .hero-content { position: relative; z-index: 2; padding: 40px; }
        .hero-badge {
            display: inline-block;
            background: rgba(255, 45, 149, 0.1);
            border: 1px solid rgba(255, 45, 149, 0.3);
            padding: 8px 25px;
            border-radius: 30px;
            font-size: 0.9em;
            color: #ff2d95;
            margin-bottom: 20px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
        }
        .glow-dot {
            display: inline-block;
            width: 8px; height: 8px;
            background: #00e676;
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
        .hero-title { font-size: 4.5em; font-weight: 800; margin-bottom: 15px; }
        .gradient-text {
            background: linear-gradient(135deg, #ff2d95, #b388ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Orbitron', monospace;
        }
        .neon-text {
            color: #fff;
            text-shadow: 0 0 20px rgba(255,45,149,0.5), 0 0 40px rgba(255,45,149,0.3);
            font-family: 'Orbitron', monospace;
        }
        .hero-subtitle { font-size: 1.2em; color: #888; max-width: 700px; margin: 0 auto 30px; line-height: 1.8; }
        .hero-stats { display: flex; justify-content: center; gap: 50px; margin: 30px 0; }
        .hero-stat { text-align: center; }
        .hero-stat-num { display: block; font-size: 2.2em; font-weight: 700; color: #ff2d95; font-family: 'Orbitron', monospace; }
        .hero-stat-label { color: #888; font-size: 0.9em; }
        .hero-buttons { display: flex; gap: 20px; justify-content: center; margin-top: 30px; }
        .btn-glow {
            display: inline-flex; align-items: center; gap: 10px;
            background: linear-gradient(135deg, #ff2d95, #b388ff);
            color: #fff; padding: 15px 40px; border-radius: 50px;
            text-decoration: none; font-weight: 600; font-size: 1.1em;
            transition: all 0.3s; box-shadow: 0 0 30px rgba(255,45,149,0.3);
        }
        .btn-glow:hover { transform: translateY(-3px); box-shadow: 0 0 50px rgba(255,45,149,0.5); color: #fff; }
        .btn-outline-glow {
            display: inline-flex; align-items: center; gap: 10px;
            border: 2px solid #ff2d95; color: #ff2d95;
            padding: 13px 40px; border-radius: 50px;
            text-decoration: none; font-weight: 600; font-size: 1.1em;
            transition: all 0.3s;
        }
        .btn-outline-glow:hover { background: rgba(255,45,149,0.1); box-shadow: 0 0 30px rgba(255,45,149,0.2); color: #ff2d95; }
        
        /* Feature Cards */
        .features-section, .tools-section { padding: 80px 0; }
        .section-title { 
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            color: #fff;
            margin-bottom: 50px;
            font-size: 2em;
        }
        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, #ff2d95, transparent);
            margin: 15px auto;
        }
        .feature-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 45, 149, 0.15);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        .feature-card:hover {
            transform: translateY(-10px);
            border-color: #ff2d95;
            box-shadow: 0 20px 60px rgba(255,45,149,0.15);
        }
        .feature-icon {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, rgba(255,45,149,0.2), rgba(179,136,255,0.2));
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            font-size: 1.8em;
            color: #ff2d95;
        }
        .feature-card h3 { color: #fff; font-size: 1.3em; margin-bottom: 15px; font-weight: 600; }
        .feature-card p { color: #888; line-height: 1.7; font-size: 0.95em; }
        
        /* Tools Grid */
        .tools-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .tool-badge {
            background: rgba(179, 136, 255, 0.1);
            border: 1px solid rgba(179, 136, 255, 0.2);
            padding: 12px 25px;
            border-radius: 12px;
            color: #b388ff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 1.1em;
            transition: all 0.3s;
        }
        .tool-badge:hover {
            background: rgba(255, 45, 149, 0.15);
            border-color: #ff2d95;
            color: #ff2d95;
            transform: scale(1.05);
        }
        
        /* Scan Page */
        .scan-section { min-height: 80vh; display: flex; align-items: center; padding: 60px 0; }
        .scan-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,45,149,0.2);
            border-radius: 25px;
            padding: 50px;
            backdrop-filter: blur(20px);
        }
        .scan-card h1 { font-family: 'Orbitron', monospace; color: #fff; font-size: 2em; }
        .scan-input {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,45,149,0.3);
            border-radius: 15px;
            padding: 18px 25px;
            color: #fff;
            font-size: 1.1em;
            width: 100%;
            transition: all 0.3s;
        }
        .scan-input:focus { border-color: #ff2d95; box-shadow: 0 0 30px rgba(255,45,149,0.2); outline: none; }
        .scan-input::placeholder { color: #666; }
        .btn-scan {
            background: linear-gradient(135deg, #ff2d95, #b388ff);
            color: #fff; border: none; padding: 18px 50px;
            border-radius: 15px; font-weight: 700; font-size: 1.2em;
            transition: all 0.3s; cursor: pointer;
        }
        .btn-scan:hover { transform: translateY(-3px); box-shadow: 0 10px 40px rgba(255,45,149,0.3); }
        .btn-scan:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Progress Bar */
        .progress-container { margin: 20px 0; }
        .progress-bar-custom {
            height: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,45,149,0.2);
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff2d95, #b388ff);
            border-radius: 10px;
            transition: width 0.5s;
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
        
        /* Dashboard */
        .dashboard-section { padding: 40px 0; }
        .stat-card-dash {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,45,149,0.15);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s;
        }
        .stat-card-dash:hover { border-color: #ff2d95; transform: translateY(-5px); }
        .stat-card-dash .stat-value { font-size: 2.5em; font-weight: 700; font-family: 'Orbitron', monospace; color: #fff; }
        .stat-card-dash .stat-label { color: #888; font-size: 0.9em; margin-top: 5px; }
        .stat-card-dash .stat-icon { font-size: 2em; margin-bottom: 10px; }
        
        .chart-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,45,149,0.15);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .chart-card h3 { color: #fff; font-size: 1.2em; margin-bottom: 20px; }
        
        /* History Table */
        .table-custom { color: #e0e0e0; }
        .table-custom th { color: #ff2d95; border-color: rgba(255,45,149,0.2); font-family: 'Rajdhani', sans-serif; font-weight: 600; }
        .table-custom td { border-color: rgba(255,45,149,0.1); vertical-align: middle; }
        .table-custom tr:hover { background: rgba(255,45,149,0.05); }
        .risk-badge { padding: 5px 15px; border-radius: 20px; font-size: 0.85em; font-weight: 600; }
        .risk-critical { background: rgba(255,23,68,0.2); color: #ff1744; border: 1px solid #ff1744; }
        .risk-high { background: rgba(255,145,0,0.2); color: #ff9100; border: 1px solid #ff9100; }
        .risk-medium { background: rgba(255,234,0,0.2); color: #ffea00; border: 1px solid #ffea00; }
        .risk-low { background: rgba(0,230,118,0.2); color: #00e676; border: 1px solid #00e676; }
        
        /* AI Analysis */
        .analysis-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,45,149,0.15);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
        }
        .recommendation-item {
            background: rgba(0,230,118,0.05);
            border-left: 4px solid #00e676;
            padding: 15px 20px;
            margin: 10px 0;
            border-radius: 0 10px 10px 0;
        }
        .recommendation-item.critical { border-left-color: #ff1744; }
        .recommendation-item.high { border-left-color: #ff9100; }
        .recommendation-item.medium { border-left-color: #ffea00; }
        .recommendation-item.low { border-left-color: #00e676; }
        
        /* Footer */
        .footer-section {
            background: rgba(10, 0, 21, 0.8);
            border-top: 1px solid rgba(255,45,149,0.1);
            padding: 20px 0;
            text-align: center;
            color: #555;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .hero-title { font-size: 2.5em; }
            .hero-stats { flex-direction: column; gap: 20px; }
            .hero-buttons { flex-direction: column; align-items: center; }
            .scan-card { padding: 25px; }
            .feature-card { margin-bottom: 20px; }
        }
        
        /* Particles background */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: rgba(255,45,149,0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        
        /* Live scan console */
        .scan-console {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,45,149,0.2);
            border-radius: 12px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: #00e676;
        }
        .scan-console::-webkit-scrollbar { width: 4px; }
        .scan-console::-webkit-scrollbar-thumb { background: #ff2d95; }
        
        .scan-msg { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .scan-msg:last-child { border-bottom: none; }
        
        /* Report page */
        .report-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,45,149,0.15);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .report-card:hover { border-color: #ff2d95; transform: translateY(-3px); }
        
        /* Loading spinner */
        .loading-spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(255,45,149,0.2);
            border-top-color: #ff2d95;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Particles will be generated by JS -->
    
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <span class="brand-icon">⚡</span>
                <span class="brand-text">DARKSPECTRE</span>
                <span class="brand-sub">AI</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">
                            <i class="fas fa-home"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'scan_page' %}active{% endif %}" href="{{ url_for('scan_page') }}">
                            <i class="fas fa-bolt"></i> Scan
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">
                            <i class="fas fa-chart-pie"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'ai_analysis' %}active{% endif %}" href="{{ url_for('ai_analysis') }}">
                            <i class="fas fa-brain"></i> AI Analysis
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'reports' %}active{% endif %}" href="{{ url_for('reports') }}">
                            <i class="fas fa-file-alt"></i> Reports
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'history' %}active{% endif %}" href="{{ url_for('history') }}">
                            <i class="fas fa-history"></i> History
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer-section">
        <div class="container">
            <p style="margin-bottom:5px">⚡ DARKSPECTRE AI — Automated Cybersecurity Intelligence Platform</p>
            <p style="font-size:0.85em;color:#444">Developed by <span style="color:#b388ff">Zakia Rani</span> | AI-Powered Vulnerability Assessment</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // Particle background generator
        function createParticles() {
            const container = document.body;
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (15 + Math.random() * 25) + 's';
                particle.style.animationDelay = (Math.random() * 15) + 's';
                particle.style.width = (2 + Math.random() * 3) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }
        createParticles();
        
        // Update scan count on home
        function updateScanCount() {
